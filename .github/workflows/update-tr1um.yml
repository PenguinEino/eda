name: update TR-1um

# TR-1um の dev ブランチの最新コミットに flake.lock を更新し、
# スモークテストが通ったら PR を作る。
on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
      - name: Update TR-1um
        id: update
        run: |
          old=$(jq -r .nodes.tr1um.locked.rev flake.lock)
          nix flake update tr1um
          new=$(jq -r .nodes.tr1um.locked.rev flake.lock)
          echo "old=${old:0:7}" >> "$GITHUB_OUTPUT"
          echo "new=${new:0:7}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.update.outputs.old != steps.update.outputs.new
        run: nix develop .#tr1um -c ./tests/smoke.sh
      - uses: peter-evans/create-pull-request@v8
        if: steps.update.outputs.old != steps.update.outputs.new
        with:
          branch: update-tr1um
          commit-message: "TR-1um dev を ${{ steps.update.outputs.new }} に更新"
          title: "TR-1um dev を ${{ steps.update.outputs.new }} に更新"
          body: |
            https://github.com/OpenSUSI/TR-1um/compare/${{ steps.update.outputs.old }}...${{ steps.update.outputs.new }}

            スモークテスト（`tests/smoke.sh`）は通っています。
