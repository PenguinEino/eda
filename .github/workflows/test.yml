name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        shell: [tr1um, sky130, gf180]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      # README と同じく、普通の Nix（NixOS 公式）と FOSSi のキャッシュを使う
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
      # ツールがキャッシュから外れて、使う人の手元でビルドされるようになっていないか
      - name: Cache check
        run: ./scripts/check-cache.sh ${{ matrix.shell }}
      - name: Smoke test
        run: nix develop .#${{ matrix.shell }} -c ./tests/smoke.sh
